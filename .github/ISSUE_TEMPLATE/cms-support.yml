name: Support for another CMS / application
description: Help add login-attack and upload checks for software other than WordPress (Joomla, Drupal, TYPO3, Shopware, Nextcloud, …)
title: "[CMS] <name of the software>"
labels: ["cms-support"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping! The script currently detects login attacks and suspicious PHP files only for **WordPress**.
        To add another application without false alarms, real log lines are needed.

        ⚠️ **This issue is public. Never paste real IP addresses, domains, usernames or email addresses.**
        Anonymize log lines with the command below (replace `yourdomain.tld`), then check the result once more before posting.

        ```bash
        DOM=yourdomain.tld
        grep -E '"POST ' /var/www/vhosts/system/$DOM/logs/access_ssl_log | tail -n 40 |
        awk -v dom="$DOM" '{ out=""; s=$0
          while (match(s, /[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/)) { ip=substr(s,RSTART,RLENGTH); if (!(ip in m)) m[ip]="203.0.113." (++n)
            out=out substr(s,1,RSTART-1) m[ip]; s=substr(s,RSTART+RLENGTH) }
          out=out s; gsub(dom, "example.com", out); print out }'
        ```

        The command keeps the *same* IP mapped to the *same* placeholder, so it stays visible which requests came from the same client. IPv6 addresses are not replaced, so remove them by hand.

  - type: input
    id: software
    attributes:
      label: Software and version
      placeholder: "e.g. Joomla 5.2.1"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Plesk version and operating system
      placeholder: "e.g. Plesk Obsidian 18.0.74, Debian 12"
    validations:
      required: true

  - type: input
    id: login-url
    attributes:
      label: Login URL of the admin area (path only)
      placeholder: "e.g. /administrator/index.php"
    validations:
      required: true

  - type: textarea
    id: log-success
    attributes:
      label: Access log – successful login (anonymized)
      description: 2–5 lines from `access_ssl_log` around one successful login. The HTTP method, path and status code matter most.
      render: text
    validations:
      required: true

  - type: textarea
    id: log-failed
    attributes:
      label: Access log – failed login (anonymized)
      description: 2–5 lines around a login with a wrong password.
      render: text
    validations:
      required: true

  - type: textarea
    id: log-attack
    attributes:
      label: Access log – brute-force attack (optional, anonymized)
      description: If you have one, a short excerpt of an attack (10–20 lines are enough).
      render: text

  - type: textarea
    id: upload-dirs
    attributes:
      label: Upload folders
      description: Which folders can visitors or editors upload files to? Paths relative to the document root.
      placeholder: |
        images/
        media/
    validations:
      required: true

  - type: textarea
    id: legit-php
    attributes:
      label: Legitimate PHP files inside those folders
      description: Are there PHP files in the upload folders that belong there (cache, index.php, plugin files)? Please list paths (relative, anonymized). If none, write "none".
      placeholder: "e.g. media/cache/*.php (generated by the template engine)"
    validations:
      required: true

  - type: textarea
    id: error-log
    attributes:
      label: Typical error_log lines (optional, anonymized)
      description: Messages the application writes to the domain's `error_log` that would be worth an alert.
      render: text

  - type: textarea
    id: wishes
    attributes:
      label: What should the report show or alert on?
      description: Anything else that would help on your server.
